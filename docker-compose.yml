version: '3.8'

services:
  # Backend: FastAPI + Telethon + Qwen
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: teleqwen-backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - TG_API_ID=${TG_API_ID}
      - TG_API_HASH=${TG_API_HASH}
      - TG_SESSION=/app/sessions/teleqwen
    volumes:
      # Сохраняем сессию Telethon между перезапусками
      - telethon_sessions:/app/sessions
      # Монтируем Qwen credentials с хоста
      - ${HOME}/.qwen:/root/.qwen
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - teleqwen-network

  # Frontend: React + nginx
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teleqwen-frontend
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - teleqwen-network

volumes:
  telethon_sessions:
    driver: local

networks:
  teleqwen-network:
    driver: bridge
